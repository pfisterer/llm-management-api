name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: the webserver imports it. `bundle` writes it
      # (swagger.json + VERSION + embedded.go) and is the same step the image
      # build runs. Needs swag only — the TypeScript client that used to be
      # bundled in here lives on npm now, so there is no Node step.
      - name: Generate embedded docs
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      - name: Tests
        if: '!cancelled()'
        run: make test

      # Known vulnerabilities in the code and its dependencies, from the Go vulnerability database. Fails only for what the code actually reaches; a vulnerable module it never calls is listed, not failed. Pinned so a new scanner release cannot break the run on its own.
      - name: govulncheck
        if: '!cancelled()'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The command line dhbw-cloud (clients/python): its tests run against a client generated from the current spec, so an API change that breaks the CLI is red here instead of after a PyPI release. Own job because it needs Node (swagger2openapi) and uv, which the checks job deliberately has none of.
  python-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Tests of dhbw-cloud
        run: make py-test
