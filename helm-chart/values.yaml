# Image; the tag defaults to the chart's appVersion, so a pinned chart pins the image.
image: ghcr.io/pfisterer/llm-management-api
version: ""
imagePullPolicy: IfNotPresent
replicas: 1

# Secret with the keys db-connection-string, role-provider-token and
# litellm-master-key. Leave empty
# to let this chart create one from `secrets` below.
existingSecret: ""
secrets:
  dbConnectionString: ""
  roleProviderToken: ""
  litellmMasterKey: ""
  # The `fleet` and `wireguard` blocks of the llm-aas inventory as JSON. Secret
  # because they carry the enrolment and admin tokens.
  fleetJson: ""
  wireguardJson: ""
  # Password of the shared LiteLLM UI account, for the autologin.
  litellmUiPassword: ""
  # GPU part: ServiceAccount token for the GPU cluster's Kubernetes API, token of the JupyterHub service gpu-management-api.
  gpuKubeToken: ""
  jupyterhubApiToken: ""
  # Token JupyterHub sends when it asks for a person's GPU access (listener :8091).
  gpuHubToken: ""
  # VLLM_API_KEY of the inference pool (gpu.inference).
  gpuInferenceApiKey: ""

config:
  # The ID token the self-service BFF forwards: issuer of the realm, audience =
  # the BFF's client id.
  oidcIssuerUrl: https://sso.dhbw.cloud/realms/dhbw-main
  oidcClientId: dhbw-cloud-selfservice
  oidcJwksUrl: ""
  roleProviderUrl: ""
  roleProviderTimeoutSeconds: 5
  tokenCacheSeconds: 60
  # Admins regardless of the stored access list (cannot be removed via the API).
  bootstrapAdmins: []
  bootstrapAdminTier: staff
  # Quota tiers as in the llm-aas inventory (keyBroker.tiers).
  tiers: []
  chatUrl: ""
  # Public OpenAI-compatible base URL (…/v1), shown to users.
  apiUrl: ""
  # LiteLLM admin UI autologin link, shown to admins only.
  adminUiUrl: ""
  # LiteLLM management API (the "backend" service, not the gateway).
  litellmUrl: ""
  # LiteLLM inference gateway: chat exchange and classification probes.
  litellmGatewayUrl: ""
  # Shared LiteLLM UI account (autologin); password under secrets.
  litellmUiUsername: ""
  # modelAliases and aliasProbes of the llm-aas inventory (classification).
  aliases: {}
  aliasProbes: {}
  maxKeysPerUser: 5

# GPU part: environments from Git repositories (repo2docker builds in the GPU cluster, images in Harbor) and JupyterHub servers. Off by default; tokens under secrets.
gpu:
  enabled: false
  # Kubernetes API of the GPU cluster (through the node's WireGuard link) and its CA (PEM).
  kubeApiUrl: ""
  kubeCa: ""
  buildNamespace: env-build
  registry: ""
  envsProject: envs
  # Empty: newest tag of <registry>/platform/repo2docker-buildkit.
  builderImage: ""
  builderSecret: harbor-envs-builder
  gitHosts: [github.com, gitlab.com]
  jupyterhubUrl: ""
  # GPU quota tiers: [{name, maxGPUs}]; access rules may name them in gpu_tier.
  tiers: []
  bootstrapAdminGpuTier: ""
  # vLLM replicas of the inference pool, reported to the discovery job as sites (GET /fleet/sites). Empty url = off. The key is gpu-inference-api-key in the existing secret; the ServiceAccount behind gpu-kube-token needs get/list on pods in the namespace.
  inference:
    url: ""
    namespace: inference
  # Listener for JupyterHub's access questions: a Service with these external IPs (the WireGuard link address of the node), so it is reachable from the GPU cluster only.
  hubAccess:
    externalIPs: []

fleet:
  # ConfigMap with the fleet scripts (dhbw-llm-*.sh), the JAMF profile template
  # (de.dhbw.llm.mobileconfig.tmpl) and README-FLOTTE.md. Empty = no fleet files.
  filesConfigMap: ""
  # Volume for the JAMF package (build-bundle.sh --upload copies it here).
  packageStorage: 2Gi

# Machine API (enrolment, scripts, hub and discovery lists): its own port and
# its own ingress, reachable without Keycloak — token authentication only.
machineIngress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

# Node selection, e.g. to keep the package volume (local-path) off a small node.
nodeSelector: {}

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 256Mi}
