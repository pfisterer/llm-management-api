# Image; the tag defaults to the chart's appVersion, so a pinned chart pins the image.
image: ghcr.io/pfisterer/llm-management-api
version: ""
# Optional image digest, e.g. digest: "sha256:<64 hex>": the image is then pulled as <image>:<version>@<digest>, so a re-pushed tag cannot change what runs. Left unset on purpose (not even ""), so the checksum/values annotation and thus the pods stay as they are.
# digest: ""
imagePullPolicy: IfNotPresent
replicas: 1

# Secret with the keys db-connection-string, role-provider-token and
# litellm-master-key. Leave empty
# to let this chart create one from `secrets` below.
existingSecret: ""
secrets:
  dbConnectionString: ""
  roleProviderToken: ""
  litellmMasterKey: ""
  # The `fleet` and `wireguard` blocks of the aiaas-deployment inventory as JSON. Secret
  # because they carry the enrolment and admin tokens.
  fleetJson: ""
  wireguardJson: ""
  # Password of the shared LiteLLM UI account, for the autologin.
  litellmUiPassword: ""
  # GPU part: ServiceAccount token for the GPU cluster's Kubernetes API, token of the JupyterHub service gpu-management-api.
  gpuKubeToken: ""
  jupyterhubApiToken: ""
  # Token JupyterHub sends when it asks for a person's GPU access (listener :8091).
  gpuHubToken: ""
  # VLLM_API_KEY of the inference pool (gpu.inference).
  gpuInferenceApiKey: ""
  # Seals the projects' tokens for private repositories and registries (base64 of 32 random bytes); empty = projects get no credentials. Changing it makes the stored tokens unreadable.
  workspaceCredentialsKey: ""
  # Token of the robot account gpu.harborScanUser (reads Harbor's vulnerability scans); empty = anonymously.
  harborScanToken: ""
  # Token of the robot account gpu.imageCleanup.user (deletes images of environments that are gone from Harbor's project envs).
  harborCleanupToken: ""
  # Tokens of the robot accounts gpu.privateBuilds.pullUser (pulls the builds from private repositories; the projects' pull secrets carry it) and gpu.imageCleanup.privateUser (cleans up the private project).
  harborPrivatePullToken: ""
  harborPrivateCleanupToken: ""
  # Key of the people's pseudonyms in the research log of the GPU cluster's workloads (table research_workloads, HMAC-SHA256, at least 16 characters); empty = the log records no person at all. A new key gives everybody new pseudonyms.
  researchPseudonymKey: ""
  # Token of the budget tree (resource-management-api) for /v1/tree; empty = off.
  treeApiToken: ""
  # Token LibreChat sends to the chat exchange (:8089) as its API key; empty = the exchange refuses every request.
  chatExchangeToken: ""

config:
  # The ID token the self-service BFF forwards: issuer of the realm, audience =
  # the BFF's client id.
  oidcIssuerUrl: https://sso.dhbw.cloud/realms/dhbw-main
  oidcClientId: dhbw-cloud-selfservice
  oidcJwksUrl: ""
  roleProviderUrl: ""
  roleProviderTimeoutSeconds: 5
  tokenCacheSeconds: 60
  # Role-provider tokens (user:<email> or group:<id>, groups resolved by the role-provider) whose holders are admins (fleet-admins too) or fleet-admins; everybody else is a plain user. The service keeps no rights of its own.
  adminTokens: []
  fleetAdminTokens: []
  chatUrl: ""
  # Public OpenAI-compatible base URL (…/v1), shown to users.
  apiUrl: ""
  # LiteLLM admin UI autologin link, shown to admins only.
  adminUiUrl: ""
  # LiteLLM management API (the "backend" service, not the gateway).
  litellmUrl: ""
  # LiteLLM inference gateway: chat exchange and classification probes.
  litellmGatewayUrl: ""
  # Shared LiteLLM UI account (autologin); password under secrets.
  litellmUiUsername: ""
  # modelAliases and aliasProbes of the aiaas-deployment inventory (classification).
  aliases: {}
  aliasProbes: {}
  maxKeysPerUser: 5
  # Personal API tokens (aiaas_…) for the management API (scripts, CI, notebooks), not the LLM keys above: lifetime when a request names none, the longest one may ask for (hours), whether a token without expiry may be issued, and how many valid tokens a person may hold.
  apiTokenTtlHours: 24
  apiTokenMaxTtlHours: 8760
  apiTokenAllowNeverExpires: false
  maxApiTokensPerUser: 10
  # Budget tree (docs/bauplan.md, Stufe 8): the LLM tokens of a project are a pool its members share (no project with tokens, no LLM), a LiteLLM team that also carries the project's requests and tokens per minute and models, all from the tree. llmDefaultRpm/llmDefaultTpm apply to a project for which the tree sets none (0 = no limit); llmBaseModels are the model groups every project may use (the tree adds more per project); every key gets llmKeyBudgetShare of its project's budget per llmKeyBudgetWindow as a short-term safety budget, and no limits of its own. selfServiceUrl is where people without a project get one.
  llmDefaultRpm: 60
  llmDefaultTpm: 200000
  llmBaseModels: [chat-default, chat-fast, code, agent, embedding]
  llmKeyBudgetShare: "0.05"
  # Reference price of a million tokens in LiteLLM's money: tree amounts are converted to a team budget with it, spend back into tokens. 0.5 = the default model's input price (modelPricing.default in aiaas-deployment); since 25.11.2026, before 0.1 (keys.DollarsPerMTokens).
  llmDollarsPerMTokens: "0.5"
  llmKeyBudgetWindow: 4h
  selfServiceUrl: ""

# GPU part: environments from Git repositories (repo2docker builds in the GPU cluster, images in Harbor) and JupyterHub servers. Off by default; tokens under secrets.
gpu:
  enabled: false
  # Kubernetes API of the GPU cluster (through the node's WireGuard link) and its CA (PEM).
  kubeApiUrl: ""
  kubeCa: ""
  buildNamespace: env-build
  registry: ""
  envsProject: envs
  # Empty: newest tag of <registry>/platform/repo2docker-buildkit.
  builderImage: ""
  builderSecret: harbor-envs-builder
  # Builds from private repositories (with the project's access to the Git host): into the private Harbor project, pushed with the robot in builderSecret (in buildNamespace), pulled with pullUser (token secrets.harborPrivatePullToken). Empty project = not offered. The ServiceAccount needs create on secrets in buildNamespace (the clone's access, owned by the build job).
  privateBuilds:
    project: ""
    builderSecret: harbor-envs-private-builder
    pullUser: ""
  # Architectures project images from Git are built for where their base has them: each other than amd64 natively in its own job on a node of it (kubernetes.io/arch, tolerating the lab pool's taint), then an index (crane, indexImage; empty = the service's default) joins them. [amd64] = one amd64 build as before.
  buildPlatforms: [amd64]
  indexImage: ""
  gitHosts: [github.com, gitlab.com]
  jupyterhubUrl: ""
  # vLLM replicas of the inference pool, reported to the discovery job as sites (GET /fleet/sites). Empty url = off. The key is gpu-inference-api-key in the existing secret; the ServiceAccount behind gpu-kube-token needs get/list on pods in the namespace.
  inference:
    url: ""
    namespace: inference
  # GPU administration (pools, tiers, node assignments; docs in the AI service's README): {enabled, reserveCPU, reserveMemoryGi, legacy: {<class>: {pool, tier}}}. The ServiceAccount needs patch on nodes, get/list/create/update on Kueue resourceflavors and clusterqueues, and on localqueues in the workspace namespace. Empty = off.
  fleet: {}
  # GPU kernel pods of "CPU + GPU-Kernel", created for the notebook servers (POST /gpu/kernels on the hub listener), in the queue of the server's GPU class; noGPU for a cluster without GPUs (kernels then run on the CPU in queue, for tests). The ServiceAccount needs create/delete on pods and read on Kueue workloads and pendingworkloads there, and list on pods cluster-wide.
  kernels:
    queue: ""
    noGPU: false
  # Batch jobs (POST /v1/gpu/jobs, docs/architektur.md "Batch-Jobs"): batch/v1 Jobs in the workspace namespace, in the project's queue job-<slug>--<class>; initImage is the image that creates the person's home in the project's volume before the job (the hub's init image, a base pinned by digest). Empty = no batch jobs. The ServiceAccount needs create/delete/list on jobs and get on pods/log there, and create/delete on Kueue cohorts.
  # host:port of an address the egress NetworkPolicies of builds, batch jobs and GPU kernels block (e.g. "10.43.0.1:443", the Kubernetes API's service address): those pods first wait in an init container until their policy is in force (kube-router installs it only seconds after the pod starts). Empty = no guard.
  egressGuard: ""
  jobs:
    initImage: ""
    # The project's volume ws-<slug> when a job comes before any workspace with storage, as the hub makes it; empty = juicefs-projects, ReadWriteMany. Needs create/patch on persistentvolumeclaims in the workspace namespace.
    storageClass: ""
    storageAccess: ""
    # Seconds a job has after TERM (eviction for a workspace, its deadline, cancel) to save a checkpoint before it is killed (terminationGracePeriodSeconds); 0 = 120, at most 600. The GPU frees up for the workspace only after it.
    graceSeconds: 0
  # Workspaces (projects): {profiles: [{slug, name, gpuClass}], gpuClasses: [...], bases: [{id, name, image, default, archs}]}; empty = no catalogue. The bases are the projects' environments (dhbw-workspace-images at its release); project images from Git are built on them and rebuilt on a new release, and they are pulled onto the CPU and GPU nodes ahead of time (DaemonSets kernel-image-prepull and kernel-image-prepull-arm64 in the workspace namespace, one per architecture, needs get/create/update on daemonsets there). The projects themselves come only from the budget tree.
  workspaces: {}
  # Project images: refused when saved above imageMaxGB (compressed; admins may save larger ones), a hint from imageHintGB; empty = 15 and 5. Harbor's vulnerability scans of images in the registry are read anonymously (public projects) unless harborScanUser and secrets.harborScanToken name a robot account that may read artifacts and scans.
  imageMaxGB: ""
  imageHintGB: ""
  harborScanUser: ""
  # Folders of removed workspace groups (workspace/group_dirs.go): the hourly job workspace-group-dirs (aiaas-deployment) lists ws-*/groups/* and deletes (into JuiceFS' trash) the folders of groups their project no longer has, only with this on; off, the plan says "would-remove" and the job only logs. Off by default: the first rollout shows what would go, the folders of groups removed before included, before anything is deleted.
  groupDirsRemove: false
  # Image cleanup: a sweep every intervalMinutes deletes from Harbor's project envs the artifacts no environment and no project names any more, once they were neither pushed nor pulled for minAgeDays; dryRun only logs what would go (metrics aiaas_image_cleanup_*). Deleting needs user and secrets.harborCleanupToken: a robot account with list and delete on repositories and artifacts in envs (robot$envs+cleanup); without it the cleanup stays a dry run. Never touches other projects (platform).
  imageCleanup:
    enabled: true
    dryRun: true
    minAgeDays: 7
    intervalMinutes: 60
    user: ""
    # Robot account with list and delete in the private project of builds from private repositories (robot$envs-private+cleanup, token secrets.harborPrivateCleanupToken); empty = that project is left alone.
    privateUser: ""
  # Research log of the GPU cluster's workloads (table research_workloads: request, Kueue admission, start, end and its reason per pod; the person only as pseudonym with secrets.researchPseudonymKey): rows are kept this many days; 0 = no log. The ServiceAccount needs list on Kueue workloads and on events in the workspace and inference namespaces.
  researchRetentionDays: 730
  # Listener for JupyterHub's access questions: a Service with these external IPs (the WireGuard link address of the node), so it is reachable from the GPU cluster only.
  hubAccess:
    externalIPs: []

fleet:
  # ConfigMap with the fleet scripts (dhbw-llm-*.sh), the JAMF profile template
  # (de.dhbw.llm.mobileconfig.tmpl) and README-FLOTTE.md. Empty = no fleet files.
  filesConfigMap: ""
  # Volume for the JAMF package (build-bundle.sh --upload copies it here).
  packageStorage: 2Gi

# Machine API (enrolment, scripts, hub and discovery lists): its own port and
# its own ingress, reachable without Keycloak — token authentication only.
machineIngress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

# Node selection, e.g. to keep the package volume (local-path) off a small node.
nodeSelector: {}

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 256Mi}
