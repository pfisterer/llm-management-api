# Image; the tag defaults to the chart's appVersion, so a pinned chart pins the image.
image: ghcr.io/pfisterer/llm-management-api
version: ""
imagePullPolicy: IfNotPresent
replicas: 1

# Secret with the keys db-connection-string, role-provider-token and
# litellm-master-key. Leave empty
# to let this chart create one from `secrets` below.
existingSecret: ""
secrets:
  dbConnectionString: ""
  roleProviderToken: ""
  litellmMasterKey: ""
  # The `fleet` and `wireguard` blocks of the aiaas-deployment inventory as JSON. Secret
  # because they carry the enrolment and admin tokens.
  fleetJson: ""
  wireguardJson: ""
  # Password of the shared LiteLLM UI account, for the autologin.
  litellmUiPassword: ""
  # GPU part: ServiceAccount token for the GPU cluster's Kubernetes API, token of the JupyterHub service gpu-management-api.
  gpuKubeToken: ""
  jupyterhubApiToken: ""
  # Token JupyterHub sends when it asks for a person's GPU access (listener :8091).
  gpuHubToken: ""
  # VLLM_API_KEY of the inference pool (gpu.inference).
  gpuInferenceApiKey: ""
  # Seals the projects' tokens for private repositories and registries (base64 of 32 random bytes); empty = projects get no credentials. Changing it makes the stored tokens unreadable.
  workspaceCredentialsKey: ""
  # Token of the robot account gpu.harborScanUser (reads Harbor's vulnerability scans); empty = anonymously.
  harborScanToken: ""
  # Token of the robot account gpu.imageCleanup.user (deletes images of environments that are gone from Harbor's project envs).
  harborCleanupToken: ""
  # Token of the budget tree (resource-management-api) for /v1/tree; empty = off.
  treeApiToken: ""
  # Token LibreChat sends to the chat exchange (:8089) as its API key; empty = the exchange refuses every request.
  chatExchangeToken: ""

config:
  # The ID token the self-service BFF forwards: issuer of the realm, audience =
  # the BFF's client id.
  oidcIssuerUrl: https://sso.dhbw.cloud/realms/dhbw-main
  oidcClientId: dhbw-cloud-selfservice
  oidcJwksUrl: ""
  roleProviderUrl: ""
  roleProviderTimeoutSeconds: 5
  tokenCacheSeconds: 60
  # Role-provider tokens (user:<email> or group:<id>, groups resolved by the role-provider) whose holders are admins (fleet-admins too) or fleet-admins; everybody else is a plain user. The service keeps no rights of its own.
  adminTokens: []
  fleetAdminTokens: []
  chatUrl: ""
  # Public OpenAI-compatible base URL (…/v1), shown to users.
  apiUrl: ""
  # LiteLLM admin UI autologin link, shown to admins only.
  adminUiUrl: ""
  # LiteLLM management API (the "backend" service, not the gateway).
  litellmUrl: ""
  # LiteLLM inference gateway: chat exchange and classification probes.
  litellmGatewayUrl: ""
  # Shared LiteLLM UI account (autologin); password under secrets.
  litellmUiUsername: ""
  # modelAliases and aliasProbes of the aiaas-deployment inventory (classification).
  aliases: {}
  aliasProbes: {}
  maxKeysPerUser: 5
  # Personal API tokens (aiaas_…) for the management API (scripts, CI, notebooks), not the LLM keys above: lifetime when a request names none, the longest one may ask for (hours), whether a token without expiry may be issued, and how many valid tokens a person may hold.
  apiTokenTtlHours: 24
  apiTokenMaxTtlHours: 8760
  apiTokenAllowNeverExpires: false
  maxApiTokensPerUser: 10
  # Budget tree (docs/bauplan.md, Stufe 8): the LLM tokens of a project are a pool its members share (no project with tokens, no LLM), a LiteLLM team that also carries the project's requests and tokens per minute and models, all from the tree. llmDefaultRpm/llmDefaultTpm apply to a project for which the tree sets none (0 = no limit); llmBaseModels are the model groups every project may use (the tree adds more per project); every key gets llmKeyBudgetShare of its project's budget per llmKeyBudgetWindow as a short-term safety budget, and no limits of its own. selfServiceUrl is where people without a project get one.
  llmDefaultRpm: 60
  llmDefaultTpm: 200000
  llmBaseModels: [chat-default, chat-fast, code, embedding]
  llmKeyBudgetShare: "0.05"
  llmKeyBudgetWindow: 4h
  selfServiceUrl: ""

# GPU part: environments from Git repositories (repo2docker builds in the GPU cluster, images in Harbor) and JupyterHub servers. Off by default; tokens under secrets.
gpu:
  enabled: false
  # Kubernetes API of the GPU cluster (through the node's WireGuard link) and its CA (PEM).
  kubeApiUrl: ""
  kubeCa: ""
  buildNamespace: env-build
  registry: ""
  envsProject: envs
  # Empty: newest tag of <registry>/platform/repo2docker-buildkit.
  builderImage: ""
  builderSecret: harbor-envs-builder
  # Architectures project images from Git are built for where their base has them (docs/todo.md multi_arch): each other than amd64 natively in its own job on a node of it (kubernetes.io/arch, tolerating the lab pool's taint), then an index (crane, indexImage; empty = the service's default) joins them. [amd64] = one amd64 build as before.
  buildPlatforms: [amd64]
  indexImage: ""
  gitHosts: [github.com, gitlab.com]
  jupyterhubUrl: ""
  # vLLM replicas of the inference pool, reported to the discovery job as sites (GET /fleet/sites). Empty url = off. The key is gpu-inference-api-key in the existing secret; the ServiceAccount behind gpu-kube-token needs get/list on pods in the namespace.
  inference:
    url: ""
    namespace: inference
  # GPU administration (pools, tiers, node assignments; docs in the AI service's README): {enabled, reserveCPU, reserveMemoryGi, legacy: {<class>: {pool, tier}}}. The ServiceAccount needs patch on nodes, get/list/create/update on Kueue resourceflavors and clusterqueues, and on localqueues in the workspace namespace. Empty = off.
  fleet: {}
  # GPU kernel pods of "CPU + GPU-Kernel", created for the notebook servers (POST /gpu/kernels on the hub listener), in the queue of the server's GPU class; noGPU for a cluster without GPUs (kernels then run on the CPU in queue, for tests). The ServiceAccount needs create/delete on pods and read on Kueue workloads and pendingworkloads there, and list on pods cluster-wide.
  kernels:
    queue: ""
    noGPU: false
  # Workspaces (projects): {profiles: [{slug, name, gpuClass}], gpuClasses: [...], bases: [{id, name, image, default, archs}]}; empty = no catalogue. The bases are the projects' environments (dhbw-workspace-images at its release); project images from Git are built on them and rebuilt on a new release, and they are pulled onto the CPU and GPU nodes ahead of time (DaemonSets kernel-image-prepull and kernel-image-prepull-arm64 in the workspace namespace, one per architecture, needs get/create/update on daemonsets there). The projects themselves come only from the budget tree.
  workspaces: {}
  # Project images (docs/todo.md image_hardening): refused when saved above imageMaxGB (compressed; admins may save larger ones), a hint from imageHintGB; empty = 15 and 5. Harbor's vulnerability scans of images in the registry are read anonymously (public projects) unless harborScanUser and secrets.harborScanToken name a robot account that may read artifacts and scans.
  imageMaxGB: ""
  imageHintGB: ""
  harborScanUser: ""
  # Image cleanup (docs/todo.md image_cleanup): a sweep every intervalMinutes deletes from Harbor's project envs the artifacts no environment and no project names any more, once they were neither pushed nor pulled for minAgeDays; dryRun only logs what would go (metrics aiaas_image_cleanup_*). Deleting needs user and secrets.harborCleanupToken: a robot account with list and delete on repositories and artifacts in envs (robot$envs+cleanup); without it the cleanup stays a dry run. Never touches other projects (platform).
  imageCleanup:
    enabled: true
    dryRun: true
    minAgeDays: 7
    intervalMinutes: 60
    user: ""
  # Listener for JupyterHub's access questions: a Service with these external IPs (the WireGuard link address of the node), so it is reachable from the GPU cluster only.
  hubAccess:
    externalIPs: []

fleet:
  # ConfigMap with the fleet scripts (dhbw-llm-*.sh), the JAMF profile template
  # (de.dhbw.llm.mobileconfig.tmpl) and README-FLOTTE.md. Empty = no fleet files.
  filesConfigMap: ""
  # Volume for the JAMF package (build-bundle.sh --upload copies it here).
  packageStorage: 2Gi

# Machine API (enrolment, scripts, hub and discovery lists): its own port and
# its own ingress, reachable without Keycloak — token authentication only.
machineIngress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  hostname: ""
  annotations: {}

# Node selection, e.g. to keep the package volume (local-path) off a small node.
nodeSelector: {}

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 256Mi}
