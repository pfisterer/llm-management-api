{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-mgmt.secretName" . }}
  labels:
    {{- include "llm-mgmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-connection-string: {{ required "secrets.dbConnectionString is required" .Values.secrets.dbConnectionString | quote }}
  role-provider-token: {{ required "secrets.roleProviderToken is required" .Values.secrets.roleProviderToken | quote }}
  litellm-master-key: {{ required "secrets.litellmMasterKey is required" .Values.secrets.litellmMasterKey | quote }}
  fleet-json: {{ .Values.secrets.fleetJson | quote }}
  wireguard-json: {{ .Values.secrets.wireguardJson | quote }}
  litellm-ui-password: {{ .Values.secrets.litellmUiPassword | quote }}
  gpu-kube-token: {{ .Values.secrets.gpuKubeToken | quote }}
  jupyterhub-api-token: {{ .Values.secrets.jupyterhubApiToken | quote }}
  gpu-hub-token: {{ .Values.secrets.gpuHubToken | quote }}
  gpu-inference-api-key: {{ .Values.secrets.gpuInferenceApiKey | quote }}
  workspace-credentials-key: {{ .Values.secrets.workspaceCredentialsKey | default "" | quote }}
  tree-api-token: {{ .Values.secrets.treeApiToken | default "" | quote }}
  chat-exchange-token: {{ .Values.secrets.chatExchangeToken | default "" | quote }}
  harbor-scan-token: {{ .Values.secrets.harborScanToken | default "" | quote }}
{{- end }}
