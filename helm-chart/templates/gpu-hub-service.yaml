{{- if .Values.gpu.enabled }}
# JupyterHub asks here who may log in and how many GPUs a person gets (GET /gpu/hub/access, bearer token). Inside the cluster through this Service; with gpu.hubAccess.externalIPs also at those addresses (JupyterHub in another cluster, e.g. through a WireGuard link).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-mgmt.name" . }}-gpu-hub
  labels:
    {{- include "llm-mgmt.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "llm-mgmt.selectorLabels" . | nindent 4 }}
  {{- with .Values.gpu.hubAccess.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - {name: gpu-hub, port: 8091, targetPort: gpu-hub}
{{- end }}
