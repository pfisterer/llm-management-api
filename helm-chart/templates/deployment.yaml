{{- $secret := include "llm-mgmt.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-mgmt.name" . }}
  labels:
    {{- include "llm-mgmt.labels" . | nindent 4 }}
  annotations:
    secret.reloader.stakater.com/reload: {{ $secret }}
    {{- with .Values.fleet.filesConfigMap }}
    configmap.reloader.stakater.com/reload: {{ . }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "llm-mgmt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-mgmt.selectorLabels" . | nindent 8 }}
    spec:
      # Never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        # The package volume is handed to root by local-path; the non-root
        # process needs group write access to it.
        fsGroup: 65532
      volumes:
        - name: tmp
          emptyDir: {}
        - name: packages
          persistentVolumeClaim: {claimName: {{ include "llm-mgmt.name" . }}-packages}
        {{- with .Values.fleet.filesConfigMap }}
        - name: fleet-files
          configMap: {name: {{ . }}}
        {{- end }}
      containers:
        - name: api
          image: {{ .Values.image }}:{{ .Values.version | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8086}
            - {name: machine, containerPort: 8087}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: packages, mountPath: /var/lib/llm-mgmt/packages}
            {{- if .Values.fleet.filesConfigMap }}
            - {name: fleet-files, mountPath: /etc/llm-mgmt/fleet, readOnly: true}
            {{- end }}
          env:
            - {name: API_MODE, value: production}
            - {name: API_BIND, value: ":8086"}
            - {name: OIDC_ISSUER_URL, value: {{ .Values.config.oidcIssuerUrl | quote }}}
            - {name: OIDC_CLIENT_ID, value: {{ .Values.config.oidcClientId | quote }}}
            - {name: OIDC_JWKS_URL, value: {{ .Values.config.oidcJwksUrl | quote }}}
            - {name: ROLE_PROVIDER_TYPE, value: http}
            - {name: ROLE_PROVIDER_URL, value: {{ required "config.roleProviderUrl is required" .Values.config.roleProviderUrl | quote }}}
            - {name: ROLE_PROVIDER_TIMEOUT_SECONDS, value: {{ .Values.config.roleProviderTimeoutSeconds | quote }}}
            - name: ROLE_PROVIDER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: role-provider-token}}
            - {name: DB_TYPE, value: postgres}
            - name: DB_CONNECTION_STRING
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: db-connection-string}}
            - {name: TOKEN_CACHE_SECONDS, value: {{ .Values.config.tokenCacheSeconds | quote }}}
            - {name: BOOTSTRAP_ADMINS, value: {{ join "," .Values.config.bootstrapAdmins | quote }}}
            - {name: BOOTSTRAP_ADMIN_TIER, value: {{ .Values.config.bootstrapAdminTier | quote }}}
            - {name: TIERS, value: {{ required "config.tiers is required" .Values.config.tiers | toJson | quote }}}
            - {name: CHAT_URL, value: {{ .Values.config.chatUrl | quote }}}
            - {name: LITELLM_URL, value: {{ required "config.litellmUrl is required" .Values.config.litellmUrl | quote }}}
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: litellm-master-key}}
            - {name: MAX_KEYS_PER_USER, value: {{ .Values.config.maxKeysPerUser | quote }}}
            - {name: MACHINE_BIND, value: ":8087"}
            - name: FLEET
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: fleet-json}}
            - name: WIREGUARD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: wireguard-json}}
            - {name: FLEET_PACKAGE_DIR, value: /var/lib/llm-mgmt/packages}
            {{- if .Values.fleet.filesConfigMap }}
            - {name: FLEET_SCRIPTS_DIR, value: /etc/llm-mgmt/fleet}
            - {name: FLEET_PROFILE_TEMPLATE, value: /etc/llm-mgmt/fleet/de.dhbw.llm.mobileconfig.tmpl}
            - {name: FLEET_README, value: /etc/llm-mgmt/fleet/README-FLOTTE.md}
            {{- end }}
